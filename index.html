<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TecniDib - V4.11</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script>pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';</script>
    
    <style>
        :root { --bg-app: #1e1e1e; --bg-panel: #2d2d2d; --text-main: #ffffff; --accent: #007acc; --border: #444444; --canvas-bg: #f5f5f5; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; user-select: none; }
        
        body {
            display: grid; grid-template-areas: "topbar topbar" "propbar propbar" "toolbar canvas";
            grid-template-rows: 50px 40px 1fr; grid-template-columns: 60px 1fr;
            height: 100vh; background-color: var(--bg-app); color: var(--text-main); overflow: hidden;
        }

        #topbar { grid-area: topbar; background-color: var(--bg-panel); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 15px; }
        #propbar { grid-area: propbar; background-color: #252525; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 15px; padding: 0 15px; font-size: 13px; }
        
        .btn-action { background: var(--accent); color: white; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 12px; }
        .btn-action:hover { background: #005f9e; }
        .btn-danger { background: #d32f2f; }
        .btn-danger:hover { background: #b71c1c; }
        .btn-success { background: #2e7d32; }
        .btn-success:hover { background: #1b5e20; }
        
        select, input[type="number"], input[type="text"] { background: #1e1e1e; color: white; border: 1px solid var(--border); padding: 4px; border-radius: 3px; }
        input[type="color"] { cursor: pointer; border: none; background: transparent; height: 26px; width: 30px; padding: 0; }

        #toolbar { grid-area: toolbar; background-color: var(--bg-panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; padding: 10px 0; gap: 5px; overflow-y: auto; }
        
        .tool-btn { width: 40px; height: 40px; border-radius: 6px; background: transparent; border: none; color: var(--text-main); cursor: pointer; display: flex; justify-content: center; align-items: center; }
        .tool-btn svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; pointer-events: none;}
        .tool-btn:hover { background-color: var(--border); }
        .tool-btn.active { background-color: var(--accent); color: #fff; }
        .tool-btn.snap-active { background-color: #2e7d32; } 

        #canvas-container { grid-area: canvas; background-color: var(--bg-app); display: flex; justify-content: center; align-items: center; overflow: auto; position: relative; padding: 20px;}
        #dibujo-svg { background-color: var(--canvas-bg); box-shadow: 0 4px 20px rgba(0,0,0,0.5); cursor: crosshair; touch-action: none; max-width: 95%; max-height: 95%; transition: width 0.1s ease-out; }

        #snap-indicator { fill: rgba(255,0,0,0.2); stroke: red; stroke-width: 1.5; opacity: 0; pointer-events: none; }
        .selection-rect { fill: rgba(0, 122, 204, 0.2); stroke: #007acc; stroke-dasharray: 4,4; stroke-width: 1; }

        #edit-modal { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #2d2d2d; padding: 20px; border: 1px solid #555; z-index: 1000; box-shadow: 0 4px 30px rgba(0,0,0,0.8); border-radius: 8px; width: 300px; }
        #edit-modal h3 { margin-bottom: 15px; color: var(--accent); font-size: 16px; }
        #edit-fields { display: flex; flex-direction: column; gap: 12px; }
        #edit-fields label { display: flex; justify-content: space-between; align-items: center; font-size: 13px; }

        #crop-modal { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.85); z-index: 2000; justify-content: center; align-items: center; flex-direction: column; }
        #crop-container { position: relative; background: #222; border: 2px solid #555; max-width: 90vw; max-height: 75vh; overflow: auto; box-shadow: 0 10px 40px rgba(0,0,0,1); }
        #crop-canvas { cursor: crosshair; display: block; }
        .crop-controls { margin-top: 20px; display: flex; gap: 15px; }
    </style>
</head>
<body>

    <header id="topbar">
        <div style="display: flex; gap: 10px; align-items: center;">
            <button class="btn-action" onclick="App.changeCanvasSize()">📏 Tamaño Lámina</button>
            <span id="canvas-label" style="font-weight: bold; margin-right: 10px;">297 x 210 mm</span>
            <div style="border-left: 1px solid var(--border); height: 20px; margin: 0 5px;"></div>
            <button class="btn-action" onclick="App.zoomCanvas(-15)" title="Alejar (Ctrl + Rueda Abajo)">➖</button>
            <span id="zoom-label" style="font-weight: bold; width: 45px; text-align: center;">95%</span>
            <button class="btn-action" onclick="App.zoomCanvas(15)" title="Acercar (Ctrl + Rueda Arriba)">➕</button>
            <span id="save-status" style="margin-left: 10px; color: #888; font-size: 12px;"></span>
        </div>
        <div style="display: flex; gap: 10px; align-items: center;">
            <span id="coords" style="color: var(--accent); font-family: monospace;">X: 0.0, Y: 0.0</span>
            <button class="btn-action btn-success" onclick="App.generateMargins()">🔲 Márgenes</button>
            
            <button class="btn-action" onclick="document.getElementById('pdf-upload').click()" title="Carga un PDF como fondo completo">📥 PDF Base</button>
            <input type="file" id="pdf-upload" accept="application/pdf" style="display:none" onchange="App.importPDF(event)">
            
            <button class="btn-action" onclick="document.getElementById('crop-upload').click()" style="background: #e67e22;" title="Sube una Imagen o PDF para recortar un trozo y pegarlo">✂️ Añadir Recorte</button>
            <input type="file" id="crop-upload" accept="image/*,application/pdf" style="display:none" onchange="App.handleCropFile(event)">

            <button class="btn-action" onclick="App.saveToFile()">💾 Guardar</button>
            <button class="btn-action" onclick="document.getElementById('json-upload').click()">📂 Cargar</button>
            <input type="file" id="json-upload" accept=".json" style="display:none" onchange="App.loadFromFile(event)">
            <button class="btn-action" onclick="App.undo()">↩</button>
            <button class="btn-action" onclick="App.redo()">↪</button>
            <button class="btn-action btn-danger" onclick="App.exportPDF()">📄 PDF</button>
            <button class="btn-action btn-success" onclick="App.newCanvas()">📄 Nuevo Lienzo</button>
        </div>
    </header>

    <div id="propbar">
        <label title="Activar/Desactivar Imantado automático a vértices">
            <button id="btn-snap" class="tool-btn snap-active" style="width: 30px; height: 30px;" onclick="App.toggleSnap()">
                <svg viewBox="0 0 24 24"><path d="M4 10V6a4 4 0 0 1 8 0v4 M12 10V6a4 4 0 0 1 8 0v4 M4 10h4v4H4z M16 10h4v4h-4z"/></svg>
            </button>
        </label>
        <div style="border-left: 1px solid var(--border); height: 20px; margin: 0 5px;"></div>
        
        <label>Línea: <input type="color" id="prop-color" value="#000000"></label>
        <label>Fondo: <input type="color" id="prop-fill-color" value="#ffffff"></label>
        <label>Grosor: <input type="number" id="prop-width" min="0" max="8" step="0.1" value="0.5" style="width: 50px;"></label>
        <label>Trazo: 
            <select id="prop-dash">
                <option value="none">Continuo</option>
                <option value="3,3">Discontinuo</option>
                <option value="10,2,2,2">Raya-Punto (Ejes)</option>
            </select>
        </label>
        <label>Acabado: 
            <select id="prop-marker">
                <option value="none">Ninguno</option>
                <option value="arrow">Flechas</option>
                <option value="tick">Líneas 45º</option>
            </select>
        </label>
        <label id="poly-prop" style="display:none; color: var(--accent); font-weight:bold;">
            Lados Polígono: <input type="number" id="prop-poly-sides" min="3" max="20" value="5" style="width: 45px;">
        </label>
    </div>

    <aside id="toolbar">
        <button class="tool-btn" data-tool="cursor" data-key="v" title="Seleccionar/Mover [Tecla: V] (Caja Selección, CTRL soltar imán/multiselección, ALT duplicar)"><svg viewBox="0 0 24 24"><path d="M5 4l14 10-5.5 1.5L16 21l-3-1-2.5-5.5L5 18z"/></svg></button>
        <button class="tool-btn active" data-tool="line" data-key="l" title="Segmento [Tecla: L] (Shift para Orto)"><svg viewBox="0 0 24 24"><line x1="4" y1="20" x2="20" y2="4"/><circle cx="4" cy="20" r="2"/><circle cx="20" cy="4" r="2"/></svg></button>
        <button class="tool-btn" data-tool="measure" data-key="m" title="Acotar ISO [Tecla: M] (1º Inicio, 2º Fin, 3º Lado)"><svg viewBox="0 0 24 24"><line x1="2" y1="12" x2="22" y2="12"/><line x1="2" y1="9" x2="2" y2="15"/><line x1="22" y1="9" x2="22" y2="15"/><text x="12" y="9" font-size="5" text-anchor="middle" fill="currentColor" stroke="none">mm</text></svg></button>
        <button class="tool-btn" data-tool="parallel" data-key="p" title="Paralela [Tecla: P]"><svg viewBox="0 0 24 24"><line x1="6" y1="22" x2="16" y2="2"/><line x1="10" y1="22" x2="20" y2="2"/></svg></button>
        <button class="tool-btn" data-tool="perpendicular" data-key="o" title="Perpendicular [Tecla: O]"><svg viewBox="0 0 24 24"><line x1="2" y1="20" x2="22" y2="20"/><line x1="12" y1="20" x2="12" y2="4"/><rect x="12" y="15" width="5" height="5"/></svg></button>
        <button class="tool-btn" data-tool="line_angle" data-key="a" title="Línea Ángulo [Tecla: A]"><svg viewBox="0 0 24 24"><line x1="2" y1="20" x2="22" y2="20"/><line x1="2" y1="20" x2="16" y2="6"/><path d="M 12 20 A 10 10 0 0 0 9 13"/></svg></button>
        <button class="tool-btn" data-tool="circle" data-key="c" title="Circunferencia [Tecla: C]"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><line x1="12" y1="10" x2="12" y2="14"/><line x1="10" y1="12" x2="14" y2="12"/></svg></button>
        <button class="tool-btn" data-tool="arc" data-key="r" title="Arco [Tecla: R] (Centro, Inicio, Fin)"><svg viewBox="0 0 24 24"><path d="M 4 12 A 8 8 0 0 1 20 12"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/></svg></button>
        <button class="tool-btn" data-tool="curve" data-key="s" title="Spline [Tecla: S]"><svg viewBox="0 0 24 24"><path d="M3 12 C 8 4, 16 20, 21 12"/><circle cx="3" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="21" cy="12" r="1.5"/></svg></button>
        <button class="tool-btn" data-tool="polygon" data-key="g" title="Polígono [Tecla: G]"><svg viewBox="0 0 24 24"><polygon points="12,2 22,9 18,21 6,21 2,9"/></svg></button>
        <button class="tool-btn" data-tool="fill" data-key="f" title="Relleno / Rayado [Tecla: F]"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18"/><line x1="3" y1="18" x2="9" y2="24"/><line x1="3" y1="12" x2="15" y2="24"/><line x1="3" y1="6" x2="21" y2="24"/><line x1="9" y1="3" x2="24" y2="18"/></svg></button>
        <button class="tool-btn" data-tool="point" data-key="x" title="Punto [Tecla: X]"><svg viewBox="0 0 24 24"><line x1="12" y1="6" x2="12" y2="18"/><line x1="6" y1="12" x2="18" y2="12"/></svg></button>
        <button class="tool-btn" data-tool="text" data-key="t" title="Texto Libre [Tecla: T]"><svg viewBox="0 0 24 24"><path d="M4 6h16 M12 6v14 M10 20h4"/></svg></button>
        <button class="tool-btn" data-tool="tag" data-key="e" title="Etiqueta Orientada [Tecla: E]"><svg viewBox="0 0 24 24"><path d="M12 2 L22 12 L12 22 L2 12 Z"/><circle cx="12" cy="12" r="2"/></svg></button>
        <button class="tool-btn" data-tool="eraser" data-key="b" title="Borrador [Tecla: B] (Clic o Caja)"><svg viewBox="0 0 24 24"><path d="M18 13l-6 6-7-7 6-6M12 7l5 5 M3 21h18"/></svg></button>
    </aside>

    <main id="canvas-container">
        <svg id="dibujo-svg" viewBox="0 0 297 210" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <marker id="arrow-end" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke" />
                </marker>
                <marker id="arrow-start" viewBox="0 0 10 10" refX="0" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke" />
                </marker>
                <marker id="tick" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                    <line x1="8" y1="2" x2="2" y2="8" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round"/>
                </marker>
                <pattern id="hatch" width="4" height="4" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
                    <line x1="0" y1="0" x2="0" y2="4" stroke="currentColor" stroke-width="0.5" />
                </pattern>
            </defs>
            <image id="bg-pdf-image" x="0" y="0" width="100%" height="100%" preserveAspectRatio="xMidYMid meet"></image>
            <g id="layer-enunciado"></g>
            <g id="layer-solucion"></g>
            <g id="layer-ghost"></g>
            <circle id="snap-indicator" r="3" cx="0" cy="0" />
        </svg>

        <div id="edit-modal">
            <h3>Propiedades del Elemento</h3>
            <div id="edit-fields"></div>
            <div style="margin-top:15px; display:flex; justify-content:flex-end; gap:10px;">
                <button class="btn-action btn-danger" onclick="App.closeEditModal()">Cerrar</button>
                <button class="btn-action btn-success" onclick="App.saveEditModal()">Guardar</button>
            </div>
        </div>
        
        <div id="crop-modal">
            <h3 style="color: white; margin-bottom: 10px; font-size: 20px;">Dibuja un rectángulo para recortar</h3>
            <div id="crop-container">
                <canvas id="crop-canvas"></canvas>
            </div>
            <div class="crop-controls">
                <button class="btn-action btn-danger" onclick="App.closeCropper()">Cancelar</button>
                <button class="btn-action btn-success" onclick="App.confirmCrop()">✂️ Recortar y Añadir</button>
            </div>
        </div>
    </main>

    <script>
        const App = {
            svg: document.getElementById('dibujo-svg'),
            layerSolucion: document.getElementById('layer-solucion'),
            layerGhost: document.getElementById('layer-ghost'),
            snapIndicator: document.getElementById('snap-indicator'),
            coordDisplay: document.getElementById('coords'),
            
            data: [], 
            history: [], 
            redoHistory: [], 
            intersections: [], 
            
            canvasSize: { w: 297, h: 210 },
            config: { snapEnabled: true },
            
            state: {
                tool: 'line',
                isDrawing: false,
                step: 0,          
                p1: null,
                p2: null,         
                currentSnap: null,
                referenceLine: null,
                selectedEntities: [],
                hoverEntity: null,     
                dragPointIndex: -1,    
                customAngle: 0,
                keyboardInput: "",
                lastEvent: null,
                lastPos: null,
                ghostP2: null,
                zoomLevel: 95, 
                initialPinchDistance: null,
                editingEntity: null,
                arcStartAngle: 0,
                arcCurrentAngle: 0,
                arcSweepAngle: 0,
                cropImage: null,
                cropRect: null,
                isBoxSelecting: false,
                duplicateNextDrag: false,   // Novedad: Control para duplicar
                hasClonedInDrag: false      // Novedad: Bandera para que solo se clone una vez por arrastre
            },

            snapTolerance: 4, 

            init() {
                this.bindUI();
                this.bindEvents();
                this.initCropEvents(); 
                this.loadFromStorage();
                
                window.addEventListener('keydown', (e) => {
                    if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
                    
                    if (!e.ctrlKey && !e.shiftKey && !e.altKey && /^[a-z]$/i.test(e.key)) {
                        if (e.key.toLowerCase() !== 'd') {
                            const btn = document.querySelector(`.tool-btn[data-key="${e.key.toLowerCase()}"]`);
                            if (btn) { btn.click(); return; }
                        }
                    }

                    // Novedad: Pulsar Alt o D para marcar que queremos duplicar en este movimiento
                    if ((e.key === 'Alt' || e.key.toLowerCase() === 'd') && !e.repeat) {
                        e.preventDefault();
                        this.state.duplicateNextDrag = true;
                        // Si ya estamos arrastrando, forzamos la actualización para que clone instantáneamente
                        if (this.state.isDrawing && this.state.tool === 'cursor' && !this.state.isBoxSelecting) {
                            this.forceGhostUpdate();
                        }
                    }
                    
                    if (this.state.isDrawing && ['line', 'measure', 'circle', 'polygon', 'arc', 'parallel', 'perpendicular', 'line_angle'].includes(this.state.tool)) {
                        if (/^[0-9\.]$/.test(e.key)) {
                            this.state.keyboardInput += e.key; this.forceGhostUpdate(); return;
                        }
                        if (e.key === 'Backspace' && this.state.keyboardInput.length > 0) {
                            this.state.keyboardInput = this.state.keyboardInput.slice(0, -1); this.forceGhostUpdate(); return;
                        }
                        if (e.key === 'Enter' && this.state.keyboardInput !== "") {
                            this.applyKeyboardMeasure(); return;
                        }
                    }

                    if (e.ctrlKey && e.key === 'z') this.undo();
                    if (e.ctrlKey && e.key === 'y') this.redo();
                    if (e.key === 'Escape') {
                        if(document.getElementById('crop-modal').style.display === 'flex') { this.closeCropper(); return; }
                        if(document.getElementById('edit-modal').style.display === 'block') { this.closeEditModal(); return; }
                        this.cancelAction();
                    }
                    
                    if ((e.key === 'Delete' || e.key === 'Backspace') && this.state.selectedEntities.length > 0) {
                        this.saveState();
                        let idsToRemove = this.state.selectedEntities.map(ent => ent.id);
                        this.data = this.data.filter(ent => !idsToRemove.includes(ent.id));
                        this.state.selectedEntities = [];
                        this.renderAll();
                    }
                });

                // Limpieza de tecla suelta
                window.addEventListener('keyup', (e) => {
                    if (e.key === 'Alt' || e.key.toLowerCase() === 'd') {
                        if (!this.state.isDrawing) this.state.duplicateNextDrag = false;
                    }
                });
            },

            handleCropFile(evt) {
                const file = evt.target.files[0];
                if (!file) return;
                
                if (file.type === "application/pdf") {
                    const reader = new FileReader();
                    reader.onload = function() {
                        const typedarray = new Uint8Array(this.result);
                        pdfjsLib.getDocument(typedarray).promise.then(pdf => {
                            pdf.getPage(1).then(page => {
                                const viewport = page.getViewport({scale: 3});
                                const canvas = document.createElement('canvas');
                                canvas.width = viewport.width; canvas.height = viewport.height;
                                page.render({canvasContext: canvas.getContext('2d'), viewport: viewport}).promise.then(() => {
                                    App.openCropper(canvas.toDataURL('image/png'));
                                });
                            });
                        });
                    };
                    reader.readAsArrayBuffer(file);
                } else if (file.type.startsWith("image/")) {
                    const reader = new FileReader();
                    reader.onload = (e) => this.openCropper(e.target.result);
                    reader.readAsDataURL(file);
                }
                evt.target.value = ""; 
            },

            openCropper(dataUrl) {
                this.state.cropImage = new Image();
                this.state.cropImage.onload = () => {
                    const c = document.getElementById('crop-canvas');
                    c.width = this.state.cropImage.width;
                    c.height = this.state.cropImage.height;
                    this.state.cropRect = null;
                    this.drawCropCanvas();
                    document.getElementById('crop-modal').style.display = 'flex';
                };
                this.state.cropImage.src = dataUrl;
            },

            closeCropper() {
                document.getElementById('crop-modal').style.display = 'none';
                this.state.cropImage = null;
                this.state.cropRect = null;
            },

            drawCropCanvas() {
                const c = document.getElementById('crop-canvas');
                const ctx = c.getContext('2d');
                ctx.clearRect(0, 0, c.width, c.height);
                ctx.drawImage(this.state.cropImage, 0, 0);
                
                if (this.state.cropRect) {
                    ctx.fillStyle = 'rgba(0,0,0,0.6)';
                    ctx.fillRect(0, 0, c.width, c.height);
                    
                    let cr = this.state.cropRect;
                    ctx.clearRect(cr.x, cr.y, cr.w, cr.h);
                    ctx.drawImage(this.state.cropImage, cr.x, cr.y, cr.w, cr.h, cr.x, cr.y, cr.w, cr.h);
                    
                    ctx.strokeStyle = '#007acc';
                    ctx.lineWidth = 3;
                    ctx.setLineDash([10, 10]);
                    ctx.strokeRect(cr.x, cr.y, cr.w, cr.h);
                    ctx.setLineDash([]);
                }
            },

            initCropEvents() {
                const c = document.getElementById('crop-canvas');
                let isDragging = false;
                let start = {x: 0, y: 0};
                
                c.addEventListener('mousedown', (e) => {
                    const rect = c.getBoundingClientRect();
                    const scaleX = c.width / rect.width;
                    const scaleY = c.height / rect.height;
                    start.x = (e.clientX - rect.left) * scaleX;
                    start.y = (e.clientY - rect.top) * scaleY;
                    isDragging = true;
                    this.state.cropRect = {x: start.x, y: start.y, w: 0, h: 0};
                });
                
                c.addEventListener('mousemove', (e) => {
                    if (!isDragging) return;
                    const rect = c.getBoundingClientRect();
                    const scaleX = c.width / rect.width;
                    const scaleY = c.height / rect.height;
                    let curX = (e.clientX - rect.left) * scaleX;
                    let curY = (e.clientY - rect.top) * scaleY;
                    
                    this.state.cropRect = {
                        x: Math.min(start.x, curX),
                        y: Math.min(start.y, curY),
                        w: Math.abs(curX - start.x),
                        h: Math.abs(curY - start.y)
                    };
                    this.drawCropCanvas();
                });
                
                c.addEventListener('mouseup', () => { isDragging = false; });
            },

            confirmCrop() {
                if (!this.state.cropRect || this.state.cropRect.w === 0 || this.state.cropRect.h === 0) {
                    return alert('Por favor, haz clic y arrastra para dibujar el área que quieres recortar.');
                }
                
                const tempC = document.createElement('canvas');
                tempC.width = this.state.cropRect.w;
                tempC.height = this.state.cropRect.h;
                const ctx = tempC.getContext('2d');
                ctx.drawImage(this.state.cropImage, this.state.cropRect.x, this.state.cropRect.y, this.state.cropRect.w, this.state.cropRect.h, 0, 0, this.state.cropRect.w, this.state.cropRect.h);
                
                const dataUrl = tempC.toDataURL('image/png');
                let displayW = this.state.cropRect.w * 0.15;
                let displayH = this.state.cropRect.h * 0.15;
                
                if (displayW > this.canvasSize.w * 0.8) {
                    let ratio = displayW / displayH;
                    displayW = this.canvasSize.w * 0.8;
                    displayH = displayW / ratio;
                }
                
                this.saveState();
                this.data.push({
                    type: 'image',
                    id: Date.now(),
                    x: 20, 
                    y: 20,
                    width: displayW,
                    height: displayH,
                    href: dataUrl
                });
                
                this.closeCropper();
                this.renderAll();
                document.querySelector('.tool-btn[data-tool="cursor"]').click();
            },

            zoomCanvas(delta) {
                if (!this.state.zoomLevel) this.state.zoomLevel = 95;
                this.state.zoomLevel = Math.max(20, Math.min(1000, this.state.zoomLevel + delta));
                this.svg.style.maxWidth = 'none'; this.svg.style.maxHeight = 'none';
                this.svg.style.width = `${this.state.zoomLevel}%`;
                document.getElementById('zoom-label').innerText = `${this.state.zoomLevel}%`;
                
                const container = document.getElementById('canvas-container');
                if (this.state.zoomLevel > 100) { container.style.justifyContent = 'flex-start'; container.style.alignItems = 'flex-start'; } 
                else { container.style.justifyContent = 'center'; container.style.alignItems = 'center'; }
            },

            forceGhostUpdate() { if (this.state.lastEvent) this.onPointerMove(this.state.lastEvent); },

            applyKeyboardMeasure() {
                let val = parseFloat(this.state.keyboardInput);
                if (isNaN(val) || val <= 0) { this.state.keyboardInput = ""; this.forceGhostUpdate(); return; }
                
                this.saveState();
                let sty = this.getStyle(); let dx, dy, mag, finalX, finalY;

                if (['line', 'parallel', 'perpendicular', 'line_angle'].includes(this.state.tool)) {
                    dx = this.state.ghostP2.x - this.state.p1.x; dy = this.state.ghostP2.y - this.state.p1.y;
                    mag = Math.hypot(dx, dy); if (mag === 0) { dx = 1; dy = 0; mag = 1; }
                    finalX = this.state.p1.x + (dx / mag) * val; finalY = this.state.p1.y + (dy / mag) * val;
                    
                    this.data.push({ type: 'line', id: Date.now(), x1: this.state.p1.x, y1: this.state.p1.y, x2: finalX, y2: finalY, style: sty });
                    this.state.referenceLine = null;
                    
                } else if (this.state.tool === 'measure') {
                    if(this.state.step === 1) {
                        dx = this.state.ghostP2.x - this.state.p1.x; dy = this.state.ghostP2.y - this.state.p1.y;
                        mag = Math.hypot(dx, dy); if (mag === 0) { dx = 1; dy = 0; mag = 1; }
                        this.state.p2 = { x: this.state.p1.x + (dx/mag)*val, y: this.state.p1.y + (dy/mag)*val };
                        this.state.step = 2; this.state.keyboardInput = ""; this.forceGhostUpdate();
                        return; 
                    }
                } else if (this.state.tool === 'circle') {
                    this.data.push({ type: 'circle', id: Date.now(), cx: this.state.p1.x, cy: this.state.p1.y, r: val, style: sty });
                } else if (this.state.tool === 'polygon') {
                    let sides = parseInt(document.getElementById('prop-poly-sides').value) || 5;
                    dx = this.state.ghostP2.x - this.state.p1.x; dy = this.state.ghostP2.y - this.state.p1.y;
                    let ang = Math.atan2(dy, dx);
                    this.data.push({ type: 'polygon', id: Date.now(), cx: this.state.p1.x, cy: this.state.p1.y, r: val, sides: sides, angle: ang, style: sty });
                } else if (this.state.tool === 'arc') {
                    if (this.state.step === 1) {
                        dx = this.state.lastPos.x - this.state.p1.x; dy = this.state.lastPos.y - this.state.p1.y;
                        mag = Math.hypot(dx, dy); if (mag === 0) { dx = 1; dy = 0; mag = 1; }
                        this.state.p2 = { x: this.state.p1.x + (dx/mag)*val, y: this.state.p1.y + (dy/mag)*val };
                        this.state.step = 2; 
                        this.state.keyboardInput = ""; 
                        this.state.arcStartAngle = Math.atan2(this.state.p2.y - this.state.p1.y, this.state.p2.x - this.state.p1.x);
                        this.state.arcCurrentAngle = this.state.arcStartAngle;
                        this.state.arcSweepAngle = 0;
                        this.forceGhostUpdate();
                        return; 
                    } else if (this.state.step === 2) {
                        let r = Math.hypot(this.state.p2.x - this.state.p1.x, this.state.p2.y - this.state.p1.y);
                        let sign = this.state.arcSweepAngle >= 0 ? 1 : -1;
                        let sweep = sign * (val * Math.PI / 180);
                        if (sweep > 1.999 * Math.PI) sweep = 1.999 * Math.PI;
                        if (sweep < -1.999 * Math.PI) sweep = -1.999 * Math.PI;
                        this.data.push({ type: 'arc', id: Date.now(), cx: this.state.p1.x, cy: this.state.p1.y, r: r, startAngle: this.state.arcStartAngle, sweepAngle: sweep, style: sty });
                    }
                }

                this.state.keyboardInput = "";
                this.cancelAction();
            },

            newCanvas() {
                if(confirm('¿Crear nuevo lienzo en blanco? Se perderá el trabajo no guardado.')) {
                    this.saveState(); this.data = []; document.getElementById('bg-pdf-image').removeAttribute('href');
                    this.cancelAction(); this.renderAll();
                }
            },

            generateMargins() {
                let mode = prompt("Generador de Márgenes:\n[1] Márgenes desde el papel (ej. 20mm izquierda)\n[2] Medida exacta Ancho x Alto", "1");
                let x, y, rw, rh;
                if (mode === "1") {
                    let mTop = parseFloat(prompt("Margen Superior (mm):", "10")) || 10; let mBottom = parseFloat(prompt("Margen Inferior (mm):", "10")) || 10;
                    let mLeft = parseFloat(prompt("Margen Izquierdo (mm):", "25")) || 25; let mRight = parseFloat(prompt("Margen Derecho (mm):", "10")) || 10;
                    x = mLeft; y = mTop; rw = this.canvasSize.w - mLeft - mRight; rh = this.canvasSize.h - mTop - mBottom;
                } else if (mode === "2") {
                    rw = parseFloat(prompt("Ancho del recuadro (mm):", "277")) || 277; rh = parseFloat(prompt("Alto del recuadro (mm):", "190")) || 190;
                    x = parseFloat(prompt("Distancia desde el borde izquierdo (X en mm):", "10")) || 10; y = parseFloat(prompt("Distancia desde el borde superior (Y en mm):", "10")) || 10;
                } else { return; }
                
                if (rw > 0 && rh > 0) {
                    this.saveState(); let s = this.getStyle(); s.width = parseFloat(s.width) + 0.3;
                    let t = Date.now();
                    this.data.push({ type: 'line', id: t+1, x1: x, y1: y, x2: x+rw, y2: y, style: {...s} });
                    this.data.push({ type: 'line', id: t+2, x1: x+rw, y1: y, x2: x+rw, y2: y+rh, style: {...s} });
                    this.data.push({ type: 'line', id: t+3, x1: x+rw, y1: y+rh, x2: x, y2: y+rh, style: {...s} });
                    this.data.push({ type: 'line', id: t+4, x1: x, y1: y+rh, x2: x, y2: y, style: {...s} });
                    this.renderAll();
                }
            },

            getStyle() {
                return {
                    width: document.getElementById('prop-width').value || 0.5,
                    dash: document.getElementById('prop-dash').value,
                    marker: document.getElementById('prop-marker').value,
                    color: document.getElementById('prop-color').value || '#000000',
                    fillColor: document.getElementById('prop-fill-color').value || '#ffffff'
                };
            },

            toggleSnap() {
                this.config.snapEnabled = !this.config.snapEnabled; const btn = document.getElementById('btn-snap');
                if(this.config.snapEnabled) btn.classList.add('snap-active'); else btn.classList.remove('snap-active');
                this.snapIndicator.style.opacity = 0;
            },

            updateIntersections() {
                this.intersections = [];
                let lines = this.data.filter(e => e.type === 'line' || e.type === 'measure');
                for(let i=0; i<lines.length; i++) {
                    for(let j=i+1; j<lines.length; j++) {
                        let l1 = lines[i], l2 = lines[j];
                        let d = (l1.x1 - l1.x2)*(l2.y1 - l2.y2) - (l1.y1 - l1.y2)*(l2.x1 - l2.x2);
                        if (d === 0) continue;
                        let t = ((l1.x1 - l2.x1)*(l2.y1 - l2.y2) - (l1.y1 - l2.y1)*(l2.x1 - l2.x2)) / d;
                        let u = -((l1.x1 - l1.x2)*(l1.y1 - l2.y1) - (l1.y1 - l1.y2)*(l1.x1 - l2.x1)) / d;
                        if (t >= -0.01 && t <= 1.01 && u >= -0.01 && u <= 1.01) {
                            this.intersections.push({ x: l1.x1 + t*(l1.x2 - l1.x1), y: l1.y1 + t*(l1.y2 - l1.y1) });
                        }
                    }
                }
            },

            distPointToSegment(M, A, B) {
                let l2 = (B.x - A.x) ** 2 + (B.y - A.y) ** 2;
                if (l2 === 0) return Math.hypot(M.x - A.x, M.y - A.y);
                let t = ((M.x - A.x) * (B.x - A.x) + (M.y - A.y) * (B.y - A.y)) / l2;
                t = Math.max(0, Math.min(1, t)); 
                let projX = A.x + t * (B.x - A.x); let projY = A.y + t * (B.y - A.y);
                return Math.hypot(M.x - projX, M.y - projY);
            },

            getHitEntity(x, y) {
                let hit = null, minDist = 4; 
                this.data.forEach(ent => {
                    if (ent.type === 'line' || ent.type === 'measure') {
                        let d = this.distPointToSegment({x, y}, {x: ent.x1, y: ent.y1}, {x: ent.x2, y: ent.y2});
                        if (d < minDist) { minDist = d; hit = ent; }
                    } else if (ent.type === 'rect') {
                        let pts = [{x: ent.x, y: ent.y}, {x: ent.x + ent.w, y: ent.y}, {x: ent.x + ent.w, y: ent.y + ent.h}, {x: ent.x, y: ent.y + ent.h}];
                        for (let i = 0; i < 4; i++) {
                            let next = (i + 1) % 4; let d = this.distPointToSegment({x,y}, pts[i], pts[next]);
                            if (d < minDist) { minDist = d; hit = ent; }
                        }
                    } else if (ent.type === 'circle' || ent.type === 'polygon') {
                        let d = Math.abs(Math.hypot(ent.cx - x, ent.cy - y) - ent.r);
                        if (d < minDist) { minDist = d; hit = ent; }
                    } else if (ent.type === 'arc') {
                        let d = Math.abs(Math.hypot(ent.cx - x, ent.cy - y) - ent.r);
                        if (d < minDist) { minDist = d; hit = ent; }
                    } else if (ent.type === 'point' || ent.type === 'text' || ent.type === 'tag') {
                        if (Math.hypot(ent.x - x, ent.y - y) < 6) { hit = ent; minDist = 0; }
                    } else if (ent.type === 'curve') {
                        ent.points.forEach(p => { if (Math.hypot(p.x - x, p.y - y) < 8) { hit = ent; minDist = 0; }});
                    } else if (ent.type === 'fill') {
                        for (let i = 0; i < ent.points.length; i++) {
                            let next = (i + 1) % ent.points.length; let d = this.distPointToSegment({x,y}, ent.points[i], ent.points[next]);
                            if (d < minDist) { minDist = d; hit = ent; }
                        }
                    } else if (ent.type === 'image') {
                        if (x >= ent.x && x <= ent.x + ent.width && y >= ent.y && y <= ent.y + ent.height) {
                            hit = ent; minDist = 0;
                        }
                    }
                });
                return hit;
            },

            smoothPath(points) {
                if (points.length < 2) return '';
                if (points.length === 2) return `M ${points[0].x} ${points[0].y} L ${points[1].x} ${points[1].y}`;
                let path = `M ${points[0].x} ${points[0].y}`;
                for (let i = 0; i < points.length - 1; i++) {
                    let p0 = i > 0 ? points[i - 1] : points[i];
                    let p1 = points[i]; let p2 = points[i + 1];
                    let p3 = i !== points.length - 2 ? points[i + 2] : p2;
                    let cp1x = p1.x + (p2.x - p0.x) / 6; let cp1y = p1.y + (p2.y - p0.y) / 6;
                    let cp2x = p2.x - (p3.x - p1.x) / 6; let cp2y = p2.y - (p3.y - p1.y) / 6;
                    path += ` C ${cp1x} ${cp1y}, ${cp2x} ${cp2y}, ${p2.x} ${p2.y}`;
                }
                return path;
            },

            getSvgArcPath(cx, cy, r, startAngle, sweepAngle) {
                if (Math.abs(sweepAngle) < 0.0001) return '';
                let endAngle = startAngle + sweepAngle;
                let p1x = cx + r * Math.cos(startAngle), p1y = cy + r * Math.sin(startAngle);
                let p2x = cx + r * Math.cos(endAngle), p2y = cy + r * Math.sin(endAngle);
                let largeArc = Math.abs(sweepAngle) > Math.PI ? 1 : 0; 
                let sweepFlag = sweepAngle > 0 ? 1 : 0; 
                return `M ${p1x} ${p1y} A ${r} ${r} 0 ${largeArc} ${sweepFlag} ${p2x} ${p2y}`;
            },

            cancelAction() {
                this.state.isDrawing = false; this.state.step = 0; this.state.referenceLine = null;
                this.state.selectedEntities = []; this.state.dragPointIndex = -1; this.state.keyboardInput = "";
                this.state.isBoxSelecting = false; 
                this.state.duplicateNextDrag = false;
                this.state.hasClonedInDrag = false;
                this.layerGhost.innerHTML = ''; this.renderAll();
            },

            calculateSnap(x, y) {
                if (!this.config.snapEnabled) { this.snapIndicator.style.opacity = 0; return {x, y}; }

                let bestSnap = null, minDistance = this.snapTolerance;
                
                this.data.forEach(ent => {
                    if (ent.type === 'line' || ent.type === 'measure') {
                        let d1 = Math.hypot(ent.x1 - x, ent.y1 - y); if (d1 < minDistance) { minDistance = d1; bestSnap = {x: ent.x1, y: ent.y1}; }
                        let d2 = Math.hypot(ent.x2 - x, ent.y2 - y); if (d2 < minDistance) { minDistance = d2; bestSnap = {x: ent.x2, y: ent.y2}; }
                        let mx = (ent.x1 + ent.x2) / 2, my = (ent.y1 + ent.y2) / 2; let dm = Math.hypot(mx - x, my - y);
                        if (dm < minDistance) { minDistance = dm; bestSnap = {x: mx, y: my}; }
                    } else if (ent.type === 'rect') {
                        let pts = [{x: ent.x, y: ent.y}, {x: ent.x + ent.w, y: ent.y}, {x: ent.x + ent.w, y: ent.y + ent.h}, {x: ent.x, y: ent.y + ent.h}];
                        pts.forEach(p => { let dp = Math.hypot(p.x - x, p.y - y); if (dp < minDistance) { minDistance = dp; bestSnap = p; } });
                    } else if (ent.type === 'point' || ent.type === 'curve' || ent.type === 'fill') {
                        let pts = (ent.type === 'point') ? [ent] : ent.points;
                        pts.forEach(p => { let dp = Math.hypot(p.x - x, p.y - y); if (dp < minDistance) { minDistance = dp; bestSnap = p; } });
                    } else if (ent.type === 'circle') {
                        let dc = Math.hypot(ent.cx - x, ent.cy - y); if (dc < minDistance) { minDistance = dc; bestSnap = {x: ent.cx, y: ent.cy}; }
                    } else if (ent.type === 'polygon') {
                        let dc = Math.hypot(ent.cx - x, ent.cy - y); if (dc < minDistance) { minDistance = dc; bestSnap = {x: ent.cx, y: ent.cy}; }
                        for(let i=0; i<ent.sides; i++) {
                            let a = ent.angle + (i * 2 * Math.PI / ent.sides); let p = {x: ent.cx + ent.r * Math.cos(a), y: ent.cy + ent.r * Math.sin(a)};
                            let dp = Math.hypot(p.x - x, p.y - y); if (dp < minDistance) { minDistance = dp; bestSnap = p; }
                        }
                    } else if (ent.type === 'arc') {
                        let dc = Math.hypot(ent.cx - x, ent.cy - y); if (dc < minDistance) { minDistance = dc; bestSnap = {x: ent.cx, y: ent.cy}; }
                        let endA = ent.sweepAngle !== undefined ? ent.startAngle + ent.sweepAngle : ent.endAngle;
                        let px1 = ent.cx + ent.r * Math.cos(ent.startAngle); let py1 = ent.cy + ent.r * Math.sin(ent.startAngle);
                        let px2 = ent.cx + ent.r * Math.cos(endA); let py2 = ent.cy + ent.r * Math.sin(endA);
                        [{x: px1, y: py1}, {x: px2, y: py2}].forEach(p => { let dp = Math.hypot(p.x - x, p.y - y); if (dp < minDistance) { minDistance = dp; bestSnap = p; } });
                    } else if (ent.type === 'image') {
                        let pts = [
                            {x: ent.x, y: ent.y}, {x: ent.x + ent.width, y: ent.y}, 
                            {x: ent.x, y: ent.y + ent.height}, {x: ent.x + ent.width, y: ent.y + ent.height}
                        ];
                        pts.forEach(p => { let dp = Math.hypot(p.x - x, p.y - y); if (dp < minDistance) { minDistance = dp; bestSnap = p; } });
                    }
                });
                
                this.intersections.forEach(p => {
                    let dp = Math.hypot(p.x - x, p.y - y);
                    if (dp < minDistance) { minDistance = dp; bestSnap = p; }
                });
                
                if (bestSnap) {
                    this.snapIndicator.setAttribute('cx', bestSnap.x); this.snapIndicator.setAttribute('cy', bestSnap.y);
                    this.snapIndicator.style.opacity = 1;
                } else { this.snapIndicator.style.opacity = 0; }
                
                return bestSnap ? bestSnap : {x, y};
            },

            getMousePos(evt) {
                const CTM = this.svg.getScreenCTM();
                let clientX = evt.touches ? evt.touches[0].clientX : evt.clientX;
                let clientY = evt.touches ? evt.touches[0].clientY : evt.clientY;
                let rawX = (clientX - CTM.e) / CTM.a; let rawY = (clientY - CTM.f) / CTM.d;
                
                if (this.state.tool === 'cursor' && this.state.isDrawing && !this.state.isBoxSelecting && evt.ctrlKey) {
                    this.snapIndicator.style.opacity = 0;
                    return {x: rawX, y: rawY};
                }
                
                return this.calculateSnap(rawX, rawY);
            },

            openEditModal(ent) {
                this.state.editingEntity = ent;
                const modal = document.getElementById('edit-modal');
                const fields = document.getElementById('edit-fields');
                fields.innerHTML = '';
                
                let s = ent.style || { width: 0.5, color: '#000000', dash: 'none', marker: 'none', fillColor: '#ffffff' };
                
                if (ent.type === 'text' || ent.type === 'tag') {
                    fields.innerHTML += `<label>Texto: <input type="text" id="edit-text" value="${ent.text}" style="width:160px;"></label>`;
                    fields.innerHTML += `<label>Tamaño (mm): <input type="number" step="0.5" id="edit-size" value="${ent.fontSize || Math.max(4, s.width*4)}" style="width:60px;"></label>`;
                    fields.innerHTML += `<label>Fuente: <select id="edit-font"><option value="sans-serif" ${ent.fontFamily==='sans-serif'?'selected':''}>Sans-Serif</option><option value="serif" ${ent.fontFamily==='serif'?'selected':''}>Serif</option><option value="monospace" ${ent.fontFamily==='monospace'?'selected':''}>Monospace</option></select></label>`;
                    fields.innerHTML += `<label>Color: <input type="color" id="edit-color" value="${s.color}"></label>`;
                } else if (ent.type === 'image') {
                    fields.innerHTML += `<label>Ancho (mm): <input type="number" step="1" id="edit-width" value="${ent.width.toFixed(1)}" style="width:60px;"></label>`;
                    fields.innerHTML += `<p style="font-size:11px; color:#aaa; margin-top:5px;">El alto se ajustará automáticamente.</p>`;
                } else {
                    fields.innerHTML += `<label>Color Línea: <input type="color" id="edit-color" value="${s.color}"></label>`;
                    fields.innerHTML += `<label>Grosor (mm): <input type="number" step="0.1" id="edit-width" value="${s.width}" style="width:60px;"></label>`;
                    fields.innerHTML += `<label>Trazo: <select id="edit-dash"><option value="none" ${s.dash==='none'?'selected':''}>Continuo</option><option value="3,3" ${s.dash==='3,3'?'selected':''}>Discontinuo</option><option value="10,2,2,2" ${s.dash==='10,2,2,2'?'selected':''}>Raya-Punto</option></select></label>`;
                    if (ent.type === 'fill' || ent.type === 'polygon' || ent.type === 'circle') {
                        fields.innerHTML += `<label>Fondo (Relleno): <input type="color" id="edit-fillColor" value="${s.fillColor}"></label>`;
                    }
                }
                modal.style.display = 'block';
            },

            closeEditModal() {
                document.getElementById('edit-modal').style.display = 'none';
                this.state.editingEntity = null;
            },

            saveEditModal() {
                let ent = this.state.editingEntity;
                if(!ent) return;
                this.saveState();
                
                if (!ent.style) ent.style = { width: 0.5, color: '#000000', dash: 'none', marker: 'none', fillColor: '#ffffff' };
                
                if (ent.type === 'text' || ent.type === 'tag') {
                    ent.text = document.getElementById('edit-text').value;
                    ent.fontSize = parseFloat(document.getElementById('edit-size').value);
                    ent.fontFamily = document.getElementById('edit-font').value;
                    ent.style.color = document.getElementById('edit-color').value;
                } else if (ent.type === 'image') {
                    let newW = parseFloat(document.getElementById('edit-width').value);
                    if (!isNaN(newW) && newW > 0) {
                        let ratio = ent.height / ent.width;
                        ent.width = newW; ent.height = newW * ratio;
                    }
                } else {
                    ent.style.color = document.getElementById('edit-color').value;
                    ent.style.width = parseFloat(document.getElementById('edit-width').value);
                    ent.style.dash = document.getElementById('edit-dash').value;
                    if (ent.type === 'fill' || ent.type === 'polygon' || ent.type === 'circle') {
                        ent.style.fillColor = document.getElementById('edit-fillColor').value;
                    }
                }
                
                this.closeEditModal();
                this.renderAll();
            },

            onPointerDown(evt) {
                if (evt.touches && evt.touches.length === 2) {
                    this.state.initialPinchDistance = Math.hypot(evt.touches[0].clientX - evt.touches[1].clientX, evt.touches[0].clientY - evt.touches[1].clientY);
                    return;
                }

                const pos = this.getMousePos(evt);
                
                if (this.state.keyboardInput !== "") { this.applyKeyboardMeasure(); return; }
                
                if (this.state.tool === 'cursor') {
                    let hit = this.getHitEntity(pos.x, pos.y);
                    if (hit) {
                        this.state.isBoxSelecting = false;
                        if (evt.ctrlKey) {
                            let idx = this.state.selectedEntities.findIndex(e => e.id === hit.id);
                            if (idx > -1) this.state.selectedEntities.splice(idx, 1);

            getRenderCota(p1x, p1y, p2x, p2y, s, dash, markStyle, distStr, opacity = "1.0", offsetDir = 1) {
                let dx = p2x - p1x, dy = p2y - p1y; let mag = Math.hypot(dx, dy);

                let extOff = off > 0 ? off + 2 : off - 2; 
                let ext1 = `<line x1="${p1x}" y1="${p1y}" x2="${p1x + nx * extOff}" y2="${p1y + ny * extOff}" stroke="${s.color}" stroke-width="0.3" ${dash} opacity="${opacity}" />`;

                let forcedMark = markStyle === '' ? `marker-end="url(#arrow-end)" marker-start="url(#arrow-start)"` : markStyle;

                if (!textStr.includes('mm')) textStr += ' mm';

                let ux = 0, uy = 0; if(mag > 0) { ux = dx/mag; uy = dy/mag; }

                if (mag > gapHalf * 2.2) {
                    let gx1 = midX - ux * gapHalf, gy1 = midY - uy * gapHalf;
                    let gx2 = midX + ux * gapHalf, gy2 = midY + uy * gapHalf;
                    let markStart = forcedMark.match(/marker-start="([^"]+)"/) ? `marker-start="${forcedMark.match(/marker-start="([^"]+)"/)[1]}"` : '';
                    let markEnd = forcedMark.match(/marker-end="([^"]+)"/) ? `marker-end="${forcedMark.match(/marker-end="([^"]+)"/)[1]}"` : '';
                    dimLine += `<line x1="${ox1}" y1="${oy1}" x2="${gx1}" y2="${gy1}" stroke="${s.color}" stroke-width="${sw}" ${markStart} opacity="${opacity}" />`;

            },

                        let midX = (this.state.p1.x + p2x) / 2, midY = (this.state.p1.y + p2y) / 2;

                            if (diff < -Math.PI) diff += 2 * Math.PI;
                            this.state.arcSweepAngle += diff;
                            if (this.state.arcSweepAngle > 1.999 * Math.PI) this.state.arcSweepAngle = 1.999 * Math.PI;
                            if (this.state.arcSweepAngle < -1.999 * Math.PI) this.state.arcSweepAngle = -1.999 * Math.PI;
                            this.state.arcCurrentAngle = currAngle;
                        } else {
                            let sign = this.state.arcSweepAngle >= 0 ? 1 : -1;
                            this.state.arcSweepAngle = sign * (parseFloat(kInput) * Math.PI / 180 || 0);
                        }

                        let degrees = Math.abs(this.state.arcSweepAngle * 180 / Math.PI);
                        let kDegStr = kInput !== "" ? kInput + "_" : degrees.toFixed(1);

                        let pathData = this.getSvgArcPath(this.state.p1.x, this.state.p1.y, r, this.state.arcStartAngle, this.state.arcSweepAngle);
                        
                        ghostContent = `<circle cx="${this.state.p1.x}" cy="${this.state.p1.y}" r="${r}" stroke="#aaa" stroke-dasharray="2,4" fill="none" stroke-width="0.5"/><path d="${pathData}" stroke="${s.color}" fill="none" stroke-width="${s.width}"/><line x1="${this.state.p1.x}" y1="${this.state.p1.y}" x2="${pos.x}" y2="${pos.y}" stroke="${s.color}" stroke-dasharray="1,2" stroke-width="0.3" opacity="0.5"/>`;
                        overlayText = `<text x="${pos.x}" y="${pos.y - 3}" fill="#007acc" font-size="4" font-family="monospace">${kDegStr}º</text>`;
                    }
                } else if (this.state.tool === 'curve') {
                    let ptsStr = this.state.p1.map(p=>`${p.x},${p.y}`).join(' ');
                    ghostContent = `<polyline points="${ptsStr} ${pos.x},${pos.y}" fill="none" stroke="${s.color}" stroke-dasharray="2,2" stroke-width="0.5"/>`;
                } else if (this.state.tool === 'fill') {
                    let pts = this.state.p1.map(p=>`${p.x},${p.y}`).join(' ');
                    ghostContent = `<polyline points="${pts} ${pos.x},${pos.y}" fill="none" stroke="${s.color}" stroke-dasharray="2,2"/>`;
                }
                
                this.layerGhost.innerHTML = ghostContent + overlayText;
            },

            onPointerUp(evt) {
                if (evt.touches && evt.touches.length < 2) { this.state.initialPinchDistance = null; }
                
                if (!this.state.isDrawing) return;
                if (['arc', 'curve', 'fill', 'line', 'measure', 'circle', 'polygon', 'parallel', 'perpendicular', 'line_angle'].includes(this.state.tool)) return; 
                
                this.state.isDrawing = false;
                
                if (this.state.tool === 'cursor') { 
                    this.state.dragPointIndex = -1; 
                    
                    if (this.state.isBoxSelecting) {
                        let pos = this.getMousePos(evt);
                        let minX = Math.min(this.state.p1.x, pos.x), maxX = Math.max(this.state.p1.x, pos.x);
                        let minY = Math.min(this.state.p1.y, pos.y), maxY = Math.max(this.state.p1.y, pos.y);
                        
                        let newlySelected = this.data.filter(e => {
                            let x = e.x || e.cx || e.x1 || (e.points && e.points[0].x); 
                            let y = e.y || e.cy || e.y1 || (e.points && e.points[0].y);
                            return (x >= minX && x <= maxX && y >= minY && y <= maxY);
                        });

                        if (evt.ctrlKey) {
                            newlySelected.forEach(ns => {
                                if (!this.state.selectedEntities.find(se => se.id === ns.id)) this.state.selectedEntities.push(ns);
                            });
                        } else {
                            this.state.selectedEntities = newlySelected;
                        }
                        
                        this.state.isBoxSelecting = false;
                        this.layerGhost.innerHTML = '';
                        this.renderAll();
                    } else {
                        // Reseteamos el comportamiento de copia para el siguiente clic
                        this.state.duplicateNextDrag = false;
                        this.saveState(); 
                    }
                    return; 
                }

                if (this.state.tool === 'eraser') {
                    let pos = this.getMousePos(evt);
                    let minX = Math.min(this.state.p1.x, pos.x), maxX = Math.max(this.state.p1.x, pos.x);
                    let minY = Math.min(this.state.p1.y, pos.y), maxY = Math.max(this.state.p1.y, pos.y);
                    this.saveState();
                    this.data = this.data.filter(e => {
                        let x = e.x || e.cx || e.x1 || (e.points && e.points[0].x); let y = e.y || e.cy || e.y1 || (e.points && e.points[0].y);
                        return !(x >= minX && x <= maxX && y >= minY && y <= maxY);
                    });
                    this.layerGhost.innerHTML = ''; this.renderAll();
                }
            },

            // --- RENDERIZADO FINAL ---
            renderAll() {
                this.layerSolucion.innerHTML = '';
                this.updateIntersections(); 
                
                this.data.forEach(ent => {
                    let isRef = (this.state.referenceLine && this.state.referenceLine.id === ent.id);
                    let isSelected = this.state.selectedEntities.some(se => se.id === ent.id);
                    let isHover = (this.state.hoverEntity && this.state.hoverEntity.id === ent.id) || isSelected;
                    
                    let s = ent.style || { width: 0.5, color: '#000', dash: 'none', marker: 'none', fillColor: '#ffffff' };
                    let color = isRef || isHover ? '#007acc' : s.color;
                    let sw = isRef || isHover ? parseFloat(s.width) + 1 : s.width;
                    let dash = s.dash !== 'none' ? `stroke-dasharray="${s.dash}"` : '';
                    
                    let markStyle = '';
                    if (s.marker === 'arrow') markStyle = `marker-end="url(#arrow-end)" marker-start="url(#arrow-start)"`;
                    else if (s.marker === 'tick') markStyle = `marker-end="url(#tick)" marker-start="url(#tick)"`;

                    if (ent.type === 'image') {
                        this.layerSolucion.innerHTML += `<image x="${ent.x}" y="${ent.y}" width="${ent.width}" height="${ent.height}" href="${ent.href}" opacity="${isSelected || isHover ? 0.7 : 1}" />`;
                        if (isSelected || isHover) {
                            this.layerSolucion.innerHTML += `<rect x="${ent.x}" y="${ent.y}" width="${ent.width}" height="${ent.height}" fill="none" stroke="#007acc" stroke-width="1" stroke-dasharray="4,4"/>`;
                        }
                    } else if (ent.type === 'line') {
                        this.layerSolucion.innerHTML += `<line x1="${ent.x1}" y1="${ent.y1}" x2="${ent.x2}" y2="${ent.y2}" stroke="${color}" stroke-width="${sw}" ${dash} ${markStyle}/>`;
                    } else if (ent.type === 'measure') {
                        let distStr = Math.hypot(ent.x2 - ent.x1, ent.y2 - ent.y1).toFixed(1);
                        this.layerSolucion.innerHTML += this.getRenderCota(ent.x1, ent.y1, ent.x2, ent.y2, s, dash, markStyle, distStr, "1.0", ent.offsetDir);
                    } else if (ent.type === 'rect') {
                        this.layerSolucion.innerHTML += `<rect x="${ent.x}" y="${ent.y}" width="${ent.w}" height="${ent.h}" fill="none" stroke="${color}" stroke-width="${sw}" ${dash}/>`;
                    } else if (ent.type === 'circle') {
                        this.layerSolucion.innerHTML += `<circle cx="${ent.cx}" cy="${ent.cy}" r="${ent.r}" fill="${s.fillColor !== '#ffffff' ? s.fillColor : 'none'}" stroke="${color}" stroke-width="${sw}" ${dash}/>`;
                        this.layerSolucion.innerHTML += `<line x1="${ent.cx-4}" y1="${ent.cy}" x2="${ent.cx+4}" y2="${ent.cy}" stroke="${color}" stroke-width="0.3"/><line x1="${ent.cx}" y1="${ent.cy-4}" x2="${ent.cx}" y2="${ent.cy+4}" stroke="${color}" stroke-width="0.3"/>`;
                    } else if (ent.type === 'polygon') {
                        let pts = [];
                        for(let i=0; i<ent.sides; i++) {
                            let a = ent.angle + (i * 2 * Math.PI / ent.sides);
                            pts.push(`${ent.cx + ent.r * Math.cos(a)},${ent.cy + ent.r * Math.sin(a)}`);
                        }
                        this.layerSolucion.innerHTML += `<polygon points="${pts.join(' ')}" fill="${s.fillColor !== '#ffffff' ? s.fillColor : 'none'}" stroke="${color}" stroke-width="${sw}" ${dash}/>`;
                    } else if (ent.type === 'arc') {
                        let sweep = ent.sweepAngle !== undefined ? ent.sweepAngle : (ent.endAngle - ent.startAngle < 0 ? ent.endAngle - ent.startAngle + 2 * Math.PI : ent.endAngle - ent.startAngle);
                        let pathData = this.getSvgArcPath(ent.cx, ent.cy, ent.r, ent.startAngle, sweep);
                        this.layerSolucion.innerHTML += `<path d="${pathData}" fill="none" stroke="${color}" stroke-width="${sw}" ${dash}/>`;
                    } else if (ent.type === 'curve') {
                        let pathData = this.smoothPath(ent.points);
                        this.layerSolucion.innerHTML += `<path d="${pathData}" fill="none" stroke="${color}" stroke-width="${sw}" ${dash}/>`;
                        if (isSelected && this.state.tool === 'cursor') {
                            ent.points.forEach(p => this.layerSolucion.innerHTML += `<circle cx="${p.x}" cy="${p.y}" r="3" fill="#fff" stroke="#007acc" stroke-width="1.5" />`);
                        }
                    } else if (ent.type === 'point') {
                        this.layerSolucion.innerHTML += `<line x1="${ent.x-3}" y1="${ent.y}" x2="${ent.x+3}" y2="${ent.y}" stroke="${color}" stroke-width="${sw}"/><line x1="${ent.x}" y1="${ent.y-3}" x2="${ent.x}" y2="${ent.y+3}" stroke="${color}" stroke-width="${sw}"/>`;
                    } else if (ent.type === 'text') {
                        this.layerSolucion.innerHTML += `<text x="${ent.x}" y="${ent.y}" fill="${color}" font-size="${ent.fontSize || Math.max(4, sw*4)}" font-family="${ent.fontFamily || 'sans-serif'}">${ent.text}</text>`;
                    } else if (ent.type === 'tag') {
                        this.layerSolucion.innerHTML += `<text x="${ent.x}" y="${ent.y}" fill="${color}" font-size="${ent.fontSize || Math.max(4, sw*4)}" font-family="${ent.fontFamily || 'sans-serif'}" transform="rotate(${ent.angle}, ${ent.x}, ${ent.y})">${ent.text}</text>`;
                    } else if (ent.type === 'fill') {
                        let pts = ent.points.map(p=>`${p.x},${p.y}`).join(' ');
                        let defs = `<defs><pattern id="pat-${ent.id}" width="6" height="6" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="${s.fillColor}" /><line x1="0" y1="0" x2="0" y2="6" stroke="${color}" stroke-width="${sw}" /></pattern></defs>`;
                        this.layerSolucion.innerHTML += `${defs}<polygon points="${pts}" fill="url(#pat-${ent.id})" stroke="${color}" stroke-width="${sw}"/>`;
                    }
                });
            },

            saveState() { this.history.push(JSON.stringify(this.data)); this.redoHistory = []; this.saveToStorage(); },
            undo() { if (this.history.length > 0) { this.redoHistory.push(JSON.stringify(this.data)); this.data = JSON.parse(this.history.pop()); this.cancelAction(); this.saveToStorage(); } },
            redo() { if (this.redoHistory.length > 0) { this.history.push(JSON.stringify(this.data)); this.data = JSON.parse(this.redoHistory.pop()); this.cancelAction(); this.saveToStorage(); } },
            clearAll() { if(confirm("¿Borrar todo?")) { this.saveState(); this.data = []; document.getElementById('bg-pdf-image').removeAttribute('href'); this.cancelAction(); } },
            
            saveToStorage() { localStorage.setItem('cad_model_v4_13', JSON.stringify({d: this.data, s: this.canvasSize})); },
            loadFromStorage() { const s = localStorage.getItem('cad_model_v4_13'); if (s) { let p = JSON.parse(s); this.data = p.d; if(p.s) { this.canvasSize = p.s; this.updateCanvas(); } this.renderAll(); } },

            saveToFile() {
                const blob = new Blob([JSON.stringify({data: this.data, size: this.canvasSize})], {type: "application/json"});
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a'); a.href = url; a.download = 'Lamina_Educacion_Plastica.json'; a.click();
            },
            loadFromFile(evt) {
                const file = evt.target.files[0]; if (!file) return;
                const reader = new FileReader();
                reader.onload = (e) => {
                    let p = JSON.parse(e.target.result); this.saveState(); this.data = p.data;
                    if(p.size) { this.canvasSize = p.size; this.updateCanvas(); }
                    this.renderAll();
                }; reader.readAsText(file);
            },

            changeCanvasSize() {
                let w = prompt("Ancho en mm:", this.canvasSize.w); let h = prompt("Alto en mm:", this.canvasSize.h);
                if (w && h) { this.canvasSize = { w: parseFloat(w), h: parseFloat(h) }; this.updateCanvas(); this.saveToStorage(); }
            },
            updateCanvas() {
                this.svg.setAttribute('viewBox', `0 0 ${this.canvasSize.w} ${this.canvasSize.h}`);
                document.getElementById('canvas-label').innerText = `${this.canvasSize.w} x ${this.canvasSize.h} mm`;
            },

            importPDF(evt) {
                const file = evt.target.files[0]; if (!file || file.type !== "application/pdf") return alert("Selecciona un PDF.");
                const reader = new FileReader();
                reader.onload = function() {
                    const typedarray = new Uint8Array(this.result);
                    pdfjsLib.getDocument(typedarray).promise.then(pdf => {
                        pdf.getPage(1).then(page => {
                            const viewport = page.getViewport({scale: 3});
                            const canvas = document.createElement('canvas'); canvas.width = viewport.width; canvas.height = viewport.height;
                            page.render({canvasContext: canvas.getContext('2d'), viewport: viewport}).promise.then(() => {
                                document.getElementById('bg-pdf-image').setAttribute('href', canvas.toDataURL('image/png'));
                            });
                        });
                    });
                }; reader.readAsArrayBuffer(file);
            },

            exportPDF() {
                const { jsPDF } = window.jspdf;
                let orientation = this.canvasSize.w > this.canvasSize.h ? 'l' : 'p';
                const doc = new jsPDF(orientation, 'mm', [this.canvasSize.w, this.canvasSize.h]);
                
                this.snapIndicator.style.opacity = 0; this.state.hoverEntity = null; this.state.selectedEntities = []; this.renderAll();
                
                const xml = new XMLSerializer().serializeToString(this.svg);
                const svg64 = btoa(unescape(encodeURIComponent(xml)));
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas'); const scale = 4;
                    canvas.width = this.canvasSize.w * scale; canvas.height = this.canvasSize.h * scale;
                    const ctx = canvas.getContext('2d');
                    ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, canvas.width, canvas.height);
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    doc.addImage(canvas.toDataURL('image/jpeg', 1.0), 'JPEG', 0, 0, this.canvasSize.w, this.canvasSize.h);
                    doc.save("Lamina_Resuelta.pdf");
                }; img.src = 'data:image/svg+xml;base64,' + svg64;
            },

            bindEvents() {
                this.svg.addEventListener('mousedown', (e) => {
                    if (e.button === 2) return; 
                    this.onPointerDown(e);
                });
                this.svg.addEventListener('mousemove', (e) => this.onPointerMove(e));
                this.svg.addEventListener('mouseup', (e) => {
                    if (e.button === 2) return;
                    this.onPointerUp(e);
                });
                
                this.svg.addEventListener('contextmenu', (e) => {
                    e.preventDefault();
                    if (this.state.isDrawing) {
                        this.cancelAction(); 
                    } else if (this.state.tool === 'cursor') {
                        const pos = this.getMousePos(e);
                        let hit = this.getHitEntity(pos.x, pos.y);
                        if (hit) this.openEditModal(hit); 
                    }
                });
                
                this.svg.addEventListener('touchstart', (e) => { e.preventDefault(); this.onPointerDown(e); }, {passive: false});
                this.svg.addEventListener('touchmove', (e) => { e.preventDefault(); this.onPointerMove(e); }, {passive: false});
                this.svg.addEventListener('touchend', (e) => { e.preventDefault(); this.onPointerUp(e); }, {passive: false});
                
                document.getElementById('canvas-container').addEventListener('wheel', (e) => {
                    if (e.ctrlKey) { e.preventDefault(); this.zoomCanvas(e.deltaY < 0 ? 10 : -10); }
                }, {passive: false});
            },

            bindUI() {
                const tools = document.querySelectorAll('.tool-btn[data-tool]');
                tools.forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        tools.forEach(t => t.classList.remove('active')); btn.classList.add('active');
                        this.cancelAction(); this.state.tool = btn.dataset.tool;
                        document.getElementById('poly-prop').style.display = this.state.tool === 'polygon' ? 'inline-block' : 'none';
                    });
                });
            }
        };

        window.onload = () => App.init();
    </script>
</body>
